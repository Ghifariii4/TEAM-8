<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daftar Akun - NeoEvent</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white">

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
          <a class="navbar-brand fw-bold" href="index.html">NeoEvent</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                <li class="nav-item"><a class="nav-link" href="events.html">Event</a></li>
                <li class="nav-item"><a class="nav-link" href="register_account.html">Daftar</a></li>
                <li class="nav-item"><a class="nav-link" href="summary.html">Riwayat</a></li>
                <li class="nav-item"><a class="nav-link" href="kontak.html">Kontak</a></li>
            </ul>
          </div>
        </div>
      </nav>

  <div class="container mt-5">
    <h2 class="mb-4 text-center">Daftar Akun NeoEvent</h2>
    <form id="registerForm" class="bg-secondary p-4 rounded">
      <div class="mb-3">
        <label for="username" class="form-label">Nama Pengguna</label>
        <input type="text" class="form-control" id="username" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Kata Sandi</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Daftar</button>
      <p class="mt-3 text-center">Sudah punya akun? <a href="login.html" class="text-info">Login di sini</a></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="register_account.js"></script>
</body>
</html>
