<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daftar Event - NeoEvent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="events_style.css" />
</head>
<body class="bg-dark">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">NeoEvent</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
            <li class="nav-item"><a class="nav-link" href="events.html">Event</a></li>
            <li class="nav-item"><a class="nav-link" href="register_account.html">Daftar</a></li>
            <li class="nav-item"><a class="nav-link" href="summary.html">Riwayat</a></li>
            <li class="nav-item"><a class="nav-link" href="kontak.html">Kontak</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Event Cards -->
  <section class="py-5">
    <div class="container">
      <h2 class="text-center mb-4 mt-4 fw-bold text-white">Daftar Event</h2>
      <div class="container my-4">
        <div class="row mb-3">
          <div class="col-md-4 offset-md-4">
            <select id="filterKategori" class="form-select">
              <option value="all">Semua Kategori</option>
              <option value="Photobooth">Photobooth</option>
              <option value="Eksperimental">Eksperimental</option>
              <option value="Selfie">Selfie</option>
              <option value="Cosplay">Cosplay</option>
            </select>
          </div>
        </div>  
      <div class="row" id="event-list">
        <!-- Card nya ada di JavaScript -->
      </div>
    </div>
  </section>

  <!-- Modal Detail Event -->
  <div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="eventModalLabel">Detail Event</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body">
          <h3 id="modalEventTitle"></h3>
          <img src="" alt="Gambar Event" class="img-fluid my-3" id="modalEventImage" />
          <p id="modalEventDesc"></p>
        </div>
        <div class="modal-footer">
          <a href="register.html" class="btn btn-daftar">Daftar Sekarang</a>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3" id="kontak">
    <div class="container">
      <p>Kontak: info@neoevent.id | Instagram: @neoevent.id</p>
      <p>&copy; 2025 NeoEvent. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="events.js"></script>
</body>
</html>
