<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formulir Pendaftaran - NeoEvent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="register_style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">NeoEvent</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
            <li class="nav-item"><a class="nav-link" href="events.html">Event</a></li>
            <li class="nav-item"><a class="nav-link" href="register_account.html">Daftar</a></li>
            <li class="nav-item"><a class="nav-link" href="summary.html">Riwayat</a></li>
            <li class="nav-item"><a class="nav-link" href="kontak.html">Kontak</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Form Section -->
  <section class="container my-5 form">
    <h2 class="text-center mb-4 mt-4">Formulir Pendaftaran Event</h2>
    <form id="registrationForm" class="mx-auto" style="max-width: 600px;">
      <div class="mb-3">
        <label for="name" class="form-label">Nama Lengkap</label>
        <input type="text" class="form-control" id="nama" required />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email Aktif</label>
        <input type="email" class="form-control" id="email" required />
      </div>
      <div class="mb-3">
        <label for="event" class="form-label">Pilih Event</label>
        <select class="form-select" id="event" required>
          <option value="">-- Pilih Event --</option>
          <option value="Flush & Flash 2025">Flush & Flash 2025</option>
          <option value="Tap to Snap">Tap to Snap</option>
          <option value="Photomatics Going Up: Snap Edition">Photomatics Going Up: Snap Edition</option>
          <option value="High Pose">High Pose</option>
          <option value="Hokkie Hour 2025">Hokkie Hour 2025</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="tickets" class="form-label">Jumlah Tiket</label>
        <input type="number" class="form-control" id="jumlah" min="1" value="1" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Total Harga</label>
        <input type="text" class="form-control" id="totalHarga" disabled  />
      </div>
      <button type="submit" class="btn w-100" id="submitBtn">Daftar</button>
    </form>
  </section>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <div class="container">
      <p>&copy; 2025 NeoEvent. All rights reserved.</p>
    </div>
  </footer>

  <script src="register.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
